<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="50%" stop-color="#F5C542" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#303030" stroke-width="4" />
  
  <!-- Outer gold accent ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
  
  <!-- Stylized Barber Shears & Razor Silhouette -->
  <!-- Blade 1 -->
  <path d="M190 350 L322 162" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
  <!-- Blade 2 -->
  <path d="M322 350 L190 162" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
  
  <!-- Shears pivot screw -->
  <circle cx="256" cy="256" r="14" fill="#080808" stroke="url(#goldGrad)" stroke-width="5" />
  
  <!-- Finger rings -->
  <circle cx="170" cy="378" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="10" />
  <circle cx="342" cy="378" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="10" />
  
  <!-- Barber Crown / Monogram R -->
  <path d="M256 100 L274 126 L298 116 L284 144 L256 134 L228 144 L214 116 L238 126 Z" fill="url(#goldGrad)" />
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">ROCHA</text>
  <text x="256" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#A3A3A3" text-anchor="middle" letter-spacing="3">ALÉM DO CORTE</text>
</svg>
